function calcGrupos(grupos,resps,prels){
  let t=0;
  for(const g of grupos){
    if(g.condId&&prels[g.condId]!==g.condVal)continue;
    for(const item of g.items){
      if(item.condId&&prels[item.condId]!==item.condVal)continue;
      const r=resps[item.id];
      if(!r||r==="nao")continue;
      if(item.neg){if(r==="sim")t+=item.peso;}
      else{t+=item.peso*(r==="sim"?1:0.5);}
    }
  }
  return t;
}

          </div>
          {fwdBtn("Avançar para Questões Preliminares →","prel")}
        </div>}

        {tab==="prel"&&<div>
          <p style={{fontSize:13,color:"#555",marginBottom:14}}>As respostas abaixo determinam a aplicabilidade de grupos de perguntas e ajustam pesos nos blocos avaliativos.</p>
          {PRELS.map(item=>{
            const r=prels[item.id]||"";
            const C={sim:CGU,nao:"#7B0000"};
            const B={sim:CGUL,nao:"#FFF0EE"};
            return <div key={item.id} style={{marginBottom:11,padding:"10px 13px",border:"1px solid #ddd",borderRadius:6}}>
              <div style={{fontSize:13.5,marginBottom:8}}>{item.text}</div>
              <div style={{display:"flex",gap:6}}>
                {["sim","nao"].map(t=>{const a=r===t;return <button key={t} onClick={()=>setPrels(p=>({...p,[item.id]:t}))}
                  style={{padding:"3px 14px",fontSize:12.5,border:"1px solid "+(a?C[t]:"#ccc"),borderRadius:4,
                    background:a?B[t]:"#fff",color:a?C[t]:"#555",fontWeight:a?600:400,cursor:"pointer"}}>
                  {t==="sim"?"Sim":"Não"}
                </button>;})}
              </div>
            </div>;
          })}
          {fwdBtn("Avançar para Bloco COI →","coi")}
        </div>}

        {tab==="coi"&&<div>
          <div style={{display:"flex",gap:12,alignItems:"center",padding:"9px 13px",background:CGUL,border:"1px solid "+CGU,borderRadius:5,marginBottom:14}}>
            <div><div style={{fontSize:11,color:CGU}}>Pontuação COI</div><div style={{fontSize:22,fontWeight:600,color:CGU}}>{COI.toFixed(3)}%</div></div>
            <div style={{fontSize:12,color:"#555"}}>Máximo: 1,8% · Mínimo: 0%</div>
          </div>
          {renderGrupos(COI_GRUPOS)}
          {fwdBtn("Avançar para Bloco MPI →","mpi")}
        </div>}

        {tab==="mpi"&&<div>
          <div style={{display:"flex",gap:12,alignItems:"center",padding:"9px 13px",background:CGUL,border:"1px solid "+CGU,borderRadius:5,marginBottom:14}}>
            <div><div style={{fontSize:11,color:CGU}}>Pontuação MPI</div><div style={{fontSize:22,fontWeight:600,color:CGU}}>{MPI.toFixed(3)}%</div></div>
            <div style={{fontSize:12,color:"#555"}}>Máximo: 1,5% · Mínimo: 0%</div>
          </div>
          {renderGrupos(MPI_GRUPOS)}
          {fwdBtn("Avançar para Bloco APJ →","apj")}
        </div>}

        {tab==="apj"&&<div>
          <div style={{padding:"8px 12px",background:"#f5f5f5",border:"1px solid #ddd",borderRadius:5,marginBottom:11,fontSize:13}}>
            {prels.p2===undefined
              ?<span style={{color:"#8B0000"}}>⚠ Defina nas Questões Preliminares se o PI foi instituído antes ou após o ato lesivo.</span>
              :prels.p2==="sim"
                ?<span style={{color:CGU}}>PI <strong>anterior</strong> ao ato lesivo — máximo APJ: 1,3% | Mínimo: −0,6%</span>
                :<span style={{color:"#856404"}}>PI <strong>posterior</strong> ao ato lesivo — máximo APJ: 0,3% | Mínimo: −0,6%</span>}
          </div>
          <div style={{display:"flex",gap:12,alignItems:"center",padding:"9px 13px",background:APJ>=0?CGUL:"rgba(180,0,0,0.07)",border:"1px solid "+(APJ>=0?CGU:"#C00"),borderRadius:5,marginBottom:14}}>
            <div><div style={{fontSize:11,color:APJ>=0?CGU:"#8B0000"}}>Pontuação APJ</div><div style={{fontSize:22,fontWeight:600,color:APJ>=0?CGU:"#8B0000"}}>{APJ.toFixed(3)}%</div></div>
          </div>
          {renderGrupos(apjG)}
          {fwdBtn("Ver Resultado Final →","res")}
        </div>}

        {tab==="res"&&<div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:14}}>
            {[["COI",COI,"máx 1,8%"],["MPI",MPI,"máx 1,5%"],["APJ",APJ,isAnt?"máx 1,3%":"máx 0,3%"]].map(([l,v,m])=>(
              <div key={l} style={{background:"#f5f7f5",borderRadius:5,padding:"10px 14px"}}>
                <div style={{fontSize:11,color:"#666",marginBottom:2}}>{l}</div>
                <div style={{fontSize:20,fontWeight:600,color:l==="APJ"&&v<0?"#8B0000":CGU}}>{v.toFixed(3)}%</div>
                <div style={{fontSize:10.5,color:"#aaa"}}>{m}</div>
              </div>
            ))}
          </div>
          <div style={{background:"#f5f7f5",borderRadius:5,padding:"10px 14px",marginBottom:12,fontSize:13}}>
            <div style={{color:"#666",marginBottom:3}}>Fórmula: [(COI × MPI) + APJ]</div>
            <div style={{fontFamily:"monospace",fontSize:13.5}}>
              [({COI.toFixed(4)} × {MPI.toFixed(4)}) + {APJ.toFixed(4)}] = {raw.toFixed(4)}%
            </div>
            {raw>=1&&<div style={{fontFamily:"monospace",fontSize:13.5,marginTop:5}}>{raw.toFixed(4)}% × 1,25 = <strong>{score.toFixed(4)}%</strong></div>}
          </div>
          {formal
            ?<div style={{background:"rgba(180,0,0,0.07)",border:"1px solid #C00",borderRadius:6,padding:"13px 16px",marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:600,color:"#8B0000",marginBottom:5}}>Programa meramente formal — score &lt; 1,0%</div>
              <div style={{fontSize:12.5,color:"#8B0000"}}>Nos termos do §2º do art. 5º da Portaria CGU nº 909/2015, o Programa de Integridade não será considerado para fins de aplicação do percentual de redução da multa.</div>
            </div>
            :<div style={{background:CGUL,border:"1px solid "+CGU,borderRadius:6,padding:"13px 16px",marginBottom:14}}>
              <div style={{fontSize:11.5,color:CGU,marginBottom:3}}>Percentual de redução da multa (art. 23, V do Decreto nº 11.129/2022)</div>
              <div style={{fontSize:32,fontWeight:700,color:CGU}}>{score.toFixed(4)}%</div>
              <div style={{fontSize:11.5,color:"#555",marginTop:3}}>PI {isAnt?"anterior":"posterior"} ao ato lesivo · Limite máximo: {isAnt?"5,0%":"3,75%"} · Score bruto: {raw.toFixed(4)}%</div>
            </div>}
          <div style={{fontSize:11,color:"#777",marginBottom:14,padding:"8px 12px",background:"#f5f5f5",borderRadius:5}}>
            <strong>Base normativa:</strong> Lei nº 12.846/2013 · Decreto nº 11.129/2022 · Portaria CGU nº 909/2015 · Portaria Conjunta CGU/STPC nº 006/2022 · Manual Prático de Avaliação de PI em PAR (CGU, 2018)
          </div>
          <button onClick={handlePrint}
            style={{padding:"8px 20px",background:CGU,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontSize:14,fontWeight:600}}>
            Gerar Relatório PDF
          </button>
          <span style={{fontSize:12,color:"#aaa",marginLeft:10}}>Abre nova janela para impressão/exportação como PDF.</span>
        </div>}
      </div>

      {/* Barra de score */}
      <div style={{position:"sticky",bottom:0,background:"#f0f2f4",borderTop:"1px solid #ddd",padding:"6px 16px",display:"flex",gap:18,alignItems:"center",flexWrap:"wrap",fontSize:13}}>
        <span style={{color:"#777",fontSize:12}}>Score em tempo real:</span>
        <span style={{color:CGU,fontWeight:600}}>COI {COI.toFixed(3)}%</span>
        <span style={{color:CGU,fontWeight:600}}>MPI {MPI.toFixed(3)}%</span>
        <span style={{color:APJ>=0?CGU:"#8B0000",fontWeight:600}}>APJ {APJ.toFixed(3)}%</span>
        <span style={{fontWeight:700,color:formal?"#8B0000":CGU,marginLeft:4}}>
          {formal?`⚠ Formal (${raw.toFixed(4)}%)`:`→ ${score.toFixed(4)}%`}
        </span>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
